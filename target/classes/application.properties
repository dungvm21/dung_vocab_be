# ------------------------------------------------------------
# Application
# ------------------------------------------------------------
spring.application.name=quizlet-fake
server.port=8080

# ------------------------------------------------------------
# PostgreSQL datasource
# ------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/quizlet_fake
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update is convenient for development.
# Use validated migrations (Flyway/Liquibase) in production.
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.SQL=DEBUG

# ------------------------------------------------------------
# JWT configuration
# The secret must be a Base64-encoded key of at least 256 bits.
# In production, inject via environment variable instead of hardcoding.
# ------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25nLWtleQ==}
app.jwt.expiration-ms=86400000

# ------------------------------------------------------------
# Jackson
# ------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC
