# ------------------------------------------------------------
# Application
# ------------------------------------------------------------
spring.application.name=quizlet-fake
# 8080 is occupied by a local Jenkins instance (127.0.0.1:8080)
server.port=8081

# ------------------------------------------------------------
# PostgreSQL datasource
# ------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/quizlet_fake
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ------------------------------------------------------------
# JPA / Hibernate
# Flyway owns the schema now — Hibernate only validates entities
# against it at startup.
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ------------------------------------------------------------
# Flyway migrations (src/main/resources/db/migration)
# ------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ------------------------------------------------------------
# JWT configuration
# The secret must be a Base64-encoded key of at least 256 bits.
# In production, inject via environment variable instead of hardcoding.
# ------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25nLWtleQ==}
# Short-lived access token — refresh token takes over renewal duty.
app.jwt.access-expiration-ms=900000
# Opaque refresh token TTL (days).
app.jwt.refresh-expiration-days=7

# ------------------------------------------------------------
# Jackson
# ------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC
